<div class="w-screen min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl border border-gray-200/50 p-6">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-gradient-to-br from-red-800 via-red-700 to-green-800 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <i class="fas fa-unlock-alt text-white text-xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mb-1">Mot de passe oublié</h2>
      <p class="text-gray-600 text-sm" *ngIf="step==='email'">Entrez votre email pour recevoir un code.</p>
      <p class="text-gray-600 text-sm" *ngIf="step==='code'">Saisissez le code à 6 chiffres reçu par email.</p>
      <p class="text-gray-600 text-sm" *ngIf="step==='reset'">Choisissez un nouveau mot de passe.</p>
    </div>

    <div *ngIf="infoMessage" class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
      <div class="flex items-start">
        <i class="fas fa-info-circle text-blue-500 text-sm mt-0.5"></i>
        <p class="text-xs font-medium text-blue-800 ml-2">{{ infoMessage }}</p>
      </div>
    </div>
    
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
      <div class="flex items-start">
        <i class="fas fa-exclamation-triangle text-red-500 text-sm mt-0.5"></i>
        <p class="text-xs font-medium text-red-800 ml-2">{{ errorMessage }}</p>
      </div>
    </div>

    <!-- Step 1: Email -->
    <form *ngIf="step==='email'" (ngSubmit)="onSendCode()" class="space-y-4">
      <div class="space-y-1">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
            <i class="fas fa-envelope text-gray-400 text-sm"></i>
          </div>
          <input id="email" type="email" name="email" [(ngModel)]="email" required placeholder="votre@email.com"
                 class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800/20 focus:border-red-800 outline-none transition-all duration-300 bg-gray-50/50 hover:bg-white text-sm">
        </div>
      </div>
      <button type="submit" [disabled]="isLoading" class="w-full bg-gradient-to-r from-red-800 via-red-700 to-green-800 text-white py-3 px-4 rounded-lg font-semibold text-sm hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-red-800/30 disabled:opacity-50 transition-all duration-300">
        <span *ngIf="!isLoading"><i class="fas fa-paper-plane mr-2"></i>Envoyer le code</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin mr-2"></i>Envoi...</span>
      </button>
      <div class="text-center text-xs text-gray-500">
        <a routerLink="/login" class="text-red-800 hover:underline font-semibold">Retour à la connexion</a>
      </div>
    </form>

    <!-- Step 2: Code -->
    <form *ngIf="step==='code'" (ngSubmit)="onVerifyCode()" class="space-y-4">
      <div class="space-y-1">
        <label for="code" class="block text-sm font-medium text-gray-700">Code à 6 chiffres</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
            <i class="fas fa-key text-gray-400 text-sm"></i>
          </div>
          <input id="code" type="text" name="code" maxlength="6" [(ngModel)]="code" required placeholder="123456"
                 class="w-full pl-10 pr-3 py-3 tracking-widest text-center border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800/20 focus:border-red-800 outline-none transition-all duration-300 bg-gray-50/50 hover:bg-white text-sm">
        </div>
        <p class="text-[11px] text-gray-500">Le code expire dans 10 minutes.</p>
      </div>
      <button type="submit" [disabled]="isLoading" class="w-full bg-gradient-to-r from-red-800 via-red-700 to-green-800 text-white py-3 px-4 rounded-lg font-semibold text-sm hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-red-800/30 disabled:opacity-50 transition-all duration-300">
        <span *ngIf="!isLoading"><i class="fas fa-check mr-2"></i>Vérifier le code</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin mr-2"></i>Vérification...</span>
      </button>
      <div class="flex items-center justify-between text-xs">
        <button type="button" (click)="goBackToEmail()" class="text-gray-600 hover:underline">Changer d'email</button>
        <button type="button" (click)="onResend()" class="text-red-800 hover:underline">Renvoyer le code</button>
      </div>
    </form>

    <!-- Step 3: Reset password -->
    <form *ngIf="step==='reset'" (ngSubmit)="onResetPassword()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required placeholder="Nouveau mot de passe"
               class="w-full mt-1 px-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800/20 focus:border-red-800 outline-none transition-all duration-300 bg-gray-50/50 hover:bg-white text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Confirmer le mot de passe</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="Confirmer le mot de passe"
               class="w-full mt-1 px-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800/20 focus:border-red-800 outline-none transition-all duration-300 bg-gray-50/50 hover:bg-white text-sm">
      </div>
      <button type="submit" [disabled]="isLoading" class="w-full bg-gradient-to-r from-red-800 via-red-700 to-green-800 text-white py-3 px-4 rounded-lg font-semibold text-sm hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-red-800/30 disabled:opacity-50 transition-all duration-300">
        <span *ngIf="!isLoading"><i class="fas fa-sync-alt mr-2"></i>Réinitialiser le mot de passe</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin mr-2"></i>Réinitialisation...</span>
      </button>
      <div class="text-center text-xs text-gray-500">
        <a routerLink="/login" class="text-red-800 hover:underline font-semibold">Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
