<div class="fixed inset-0 z-[9999] grid place-items-center bg-black/60 px-4" *ngIf="isOpen">
  <div class="w-full max-w-xl overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl">
    <div class="flex items-center justify-between border-b bg-gradient-to-r from-maroc-vert to-emerald-700 px-5 py-3 text-white">
      <h3 class="m-0 text-lg font-extrabold">Réserver</h3>
      <button class="grid h-8 w-8 place-items-center rounded-full bg-white/15 text-white" (click)="close()">×</button>
    </div>

    <div class="space-y-4 px-5 py-4">
      <div>
        <label for="dateArrivee" class="mb-1 block text-sm font-semibold text-slate-700">Date d'arrivée *</label>
        <div class="relative">
          <input type="date" id="dateArrivee" name="dateArrivee" [(ngModel)]="dateArrivee" required [min]="getTodayString()" [disabled]="dateIsDisabled(dateArrivee)" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-maroc-vert focus:outline-none focus:ring-2 focus:ring-maroc-vert/20" [ngClass]="{ 'border-emerald-500 bg-emerald-50 font-semibold text-emerald-800': dateArrivee }" />
          <i class="fas fa-calendar absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <div class="absolute -top-2 right-2 hidden rounded-full bg-emerald-600 px-2 py-0.5 text-xs font-semibold text-white shadow" *ngIf="dateArrivee"><i class="fas fa-check-circle mr-1"></i>Date sélectionnée</div>
        </div>
      </div>

      <div>
        <label for="dateDepart" class="mb-1 block text-sm font-semibold text-slate-700">Date de départ *</label>
        <div class="relative">
          <input type="date" id="dateDepart" name="dateDepart" [(ngModel)]="dateDepart" required [min]="getNextDayString(dateArrivee)" [disabled]="dateIsDisabled(dateDepart)" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-maroc-vert focus:outline-none focus:ring-2 focus:ring-maroc-vert/20" [ngClass]="{ 'border-emerald-500 bg-emerald-50 font-semibold text-emerald-800': dateDepart }" />
          <i class="fas fa-calendar absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <div class="absolute -top-2 right-2 hidden rounded-full bg-emerald-600 px-2 py-0.5 text-xs font-semibold text-white shadow" *ngIf="dateDepart"><i class="fas fa-check-circle mr-1"></i>Date sélectionnée</div>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700">Voyageurs</label>
        <input type="number" min="1" [max]="capaciteMax" [(ngModel)]="nombreVoyageurs" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-maroc-vert focus:outline-none focus:ring-2 focus:ring-maroc-vert/20" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700">Mode de paiement</label>
        <select [(ngModel)]="modePaiement" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-maroc-vert focus:outline-none focus:ring-2 focus:ring-maroc-vert/20">
          <option value="PAIEMENT_SUR_PLACE">Paiement sur place</option>
          <option value="CARTE">Carte</option>
          <option value="VIREMENT">Virement</option>
        </select>
      </div>

      <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700">Message au propriétaire (optionnel)</label>
        <textarea [(ngModel)]="messageProprietaire" rows="3" placeholder="Heure d'arrivée, demandes spéciales..." class="w-full resize-y rounded-lg border border-slate-300 px-3 py-2 focus:border-maroc-vert focus:outline-none focus:ring-2 focus:ring-maroc-vert/20"></textarea>
      </div>

      <div class="rounded-lg border border-rose-300/60 bg-rose-50 px-3 py-2 text-rose-700" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="rounded-xl border border-slate-200 bg-slate-50 p-3" *ngIf="recapitulatif">
        <h4 class="m-0 mb-2 text-base font-bold text-slate-900">Récapitulatif</h4>
        <div class="flex items-center justify-between py-1"><span>Nuits</span><span>{{ recapitulatif.nombreNuits }}</span></div>
        <div class="flex items-center justify-between py-1" *ngIf="recapitulatif.fraisService"><span>Frais de service</span><span>{{ recapitulatif.fraisService }}€</span></div>
        <div class="flex items-center justify-between py-1" *ngIf="recapitulatif.fraisNettoyage"><span>Frais de nettoyage</span><span>{{ recapitulatif.fraisNettoyage }}€</span></div>
        <div class="flex items-center justify-between py-1" *ngIf="recapitulatif.fraisDepot"><span>Dépôt</span><span>{{ recapitulatif.fraisDepot }}€</span></div>
        <div class="mt-2 flex items-center justify-between border-t pt-2 font-extrabold"><span>Total</span><span>{{ recapitulatif.prixTotal }}€</span></div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 border-t bg-slate-50 px-5 py-3">
      <button type="button" class="rounded-xl border border-slate-300 bg-white px-4 py-2 font-semibold text-slate-800" (click)="close()">Annuler</button>
      <button type="button" class="rounded-xl bg-gradient-to-r from-sky-600 to-sky-700 px-4 py-2 font-semibold text-white disabled:opacity-60" (click)="verifierEtRecap()" [disabled]="loading || !isDateRangeValid">
        <span *ngIf="loading">Chargement...</span>
        <span *ngIf="!loading">Calculer le prix</span>
      </button>
      <button type="button" class="rounded-xl bg-gradient-to-r from-maroc-vert to-emerald-700 px-4 py-2 font-semibold text-white disabled:opacity-60" (click)="confirmerReservation()" [disabled]="!recapitulatif || loading">Confirmer la réservation</button>
    </div>
  </div>
</div>
