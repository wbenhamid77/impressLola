<div class="modal-overlay" (click)="fermerModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Header du modal -->
    <div class="modal-header">
      <div class="header-content">
        <h2 class="modal-title">
          <i class="fas fa-key"></i>
          Changer le mot de passe
        </h2>
        <div class="header-subtitle">
          <i class="fas fa-star"></i>
          <span>CAF 2025 - Sécurité</span>
          <i class="fas fa-star"></i>
        </div>
      </div>
      <button class="btn-close" (click)="fermerModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Contenu du modal -->
    <div class="modal-content">
      <!-- Loading -->
      <div *ngIf="isLoading" class="loading-container">
        <div class="loading-spinner">
          <div class="spinner-ring"></div>
          <div class="spinner-ring"></div>
          <div class="spinner-ring"></div>
        </div>
        <p>Modification en cours...</p>
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="error-message">
        <i class="fas fa-exclamation-triangle"></i>
        <p>{{ errorMessage }}</p>
      </div>

      <!-- Message de succès -->
      <div *ngIf="successMessage" class="success-message">
        <i class="fas fa-check-circle"></i>
        <p>{{ successMessage }}</p>
      </div>

      <!-- Formulaire -->
      <form *ngIf="!isLoading && !successMessage" [formGroup]="passwordForm" (ngSubmit)="changerMotDePasse()" class="password-form">
        <div class="form-group">
          <label for="ancienMotDePasse">
            <i class="fas fa-lock"></i>
            Ancien mot de passe
          </label>
          <div class="input-container">
            <input 
              type="password" 
              id="ancienMotDePasse"
              formControlName="ancienMotDePasse"
              placeholder="Entrez votre ancien mot de passe"
              class="form-input"
              [class.error]="passwordForm.get('ancienMotDePasse')?.invalid && passwordForm.get('ancienMotDePasse')?.touched"
            >
            <button 
              type="button" 
              class="btn-toggle-password"
              (click)="togglePasswordVisibility('ancienMotDePasse')"
            >
              <i class="fas" [class]="showAncienPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <div *ngIf="passwordForm.get('ancienMotDePasse')?.invalid && passwordForm.get('ancienMotDePasse')?.touched" class="error-text">
            <i class="fas fa-exclamation-circle"></i>
            <span>L'ancien mot de passe est requis</span>
          </div>
        </div>

        <div class="form-group">
          <label for="nouveauMotDePasse">
            <i class="fas fa-key"></i>
            Nouveau mot de passe
          </label>
          <div class="input-container">
            <input 
              type="password" 
              id="nouveauMotDePasse"
              formControlName="nouveauMotDePasse"
              placeholder="Entrez votre nouveau mot de passe"
              class="form-input"
              [class.error]="passwordForm.get('nouveauMotDePasse')?.invalid && passwordForm.get('nouveauMotDePasse')?.touched"
            >
            <button 
              type="button" 
              class="btn-toggle-password"
              (click)="togglePasswordVisibility('nouveauMotDePasse')"
            >
              <i class="fas" [class]="showNouveauPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <div *ngIf="passwordForm.get('nouveauMotDePasse')?.invalid && passwordForm.get('nouveauMotDePasse')?.touched" class="error-text">
            <i class="fas fa-exclamation-circle"></i>
            <span>Le nouveau mot de passe doit contenir au moins 8 caractères</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmerMotDePasse">
            <i class="fas fa-check-double"></i>
            Confirmer le nouveau mot de passe
          </label>
          <div class="input-container">
            <input 
              type="password" 
              id="confirmerMotDePasse"
              formControlName="confirmerMotDePasse"
              placeholder="Confirmez votre nouveau mot de passe"
              class="form-input"
              [class.error]="passwordForm.get('confirmerMotDePasse')?.invalid && passwordForm.get('confirmerMotDePasse')?.touched"
            >
            <button 
              type="button" 
              class="btn-toggle-password"
              (click)="togglePasswordVisibility('confirmerMotDePasse')"
            >
              <i class="fas" [class]="showConfirmerPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <div *ngIf="passwordForm.get('confirmerMotDePasse')?.invalid && passwordForm.get('confirmerMotDePasse')?.touched" class="error-text">
            <i class="fas fa-exclamation-circle"></i>
            <span>Les mots de passe ne correspondent pas</span>
          </div>
        </div>

        <!-- Indicateur de force du mot de passe -->
        <div class="password-strength" *ngIf="passwordForm.get('nouveauMotDePasse')?.value">
          <label>Force du mot de passe :</label>
          <div class="strength-bar">
            <div class="strength-fill" [class]="getPasswordStrengthClass()"></div>
          </div>
          <span class="strength-text">{{ getPasswordStrengthText() }}</span>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="button" class="btn-cancel" (click)="fermerModal()">
            <i class="fas fa-times"></i>
            Annuler
          </button>
          <button 
            type="submit" 
            class="btn-submit" 
            [disabled]="passwordForm.invalid || isLoading"
          >
            <i class="fas fa-save"></i>
            Changer le mot de passe
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
