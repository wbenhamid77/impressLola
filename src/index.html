  <!-- Styles Critiques Inline pour optimiser le LCP -->
  <style>
    /* Critical CSS pour éviter le FOUC */
    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #111827;
      overflow-x: hidden;
    }
    
    /* Loading Screen Ultra-Premium */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #C1272D 0%, #006233 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    
    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    
    .loading-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      animation: pulse-loading 2s ease-in-out infinite;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin-loading 1s linear infinite;
    }
    
    .loading-text {
      color: white;
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1rem;
      opacity: 0.9;
    }
    
    @keyframes pulse-loading {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes spin-loading {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* App Root Initial State */
    app-root {
      display: block;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    
    app-root.loaded {
      opacity: 1;
    }
    
    /* Error Fallback */

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

<body class="antialiased theme-maroc-light">
  <!-- Loading Screen Ultra-Premium -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-logo">

    </div>
    <div class="loading-text">ImpressLola CAN 2025</div>
  </div>

    </div>
    <div class="error-message">
      Une erreur est survenue lors du chargement de l'application
    </div>
    <div class="error-description">
      Veuillez vérifier votre connexion Internet et réessayer. Si le problème persiste, contactez notre support technique.
    </div>
    <button class="retry-button" onclick="window.location.reload()">
      <i class="fas fa-redo-alt"></i> Réessayer
    </button>
  </div>
  
  <!-- Application Principal -->
  <app-root id="app-root"></app-root>
  
  <!-- Scripts pour optimiser le chargement -->
  <script>
    // Gestion du loading screen et des performances
    document.addEventListener('DOMContentLoaded', function() {
      const loadingScreen = document.getElementById('loading-screen');
      const appRoot = document.getElementById('app-root');
      const errorFallback = document.getElementById('error-fallback');
      
      // Timer de sécurité pour le loading
      const loadingTimeout = setTimeout(() => {
        hideLoadingScreen();
      }, 10000);
      
      // Fonction pour masquer le loading screen
      function hideLoadingScreen() {
        clearTimeout(loadingTimeout);
        loadingScreen.classList.add('hidden');
        appRoot.classList.add('loaded');
        
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 500);
      }
      
      // Attendre que Angular soit chargé
      function checkAngularLoaded() {
        if (window.ng && document.querySelector('app-root').children.length > 0) {
          hideLoadingScreen();
        } else {
          setTimeout(checkAngularLoaded, 100);
        }
      }
      
      // Démarrer la vérification
      setTimeout(checkAngularLoaded, 1000);
      
      // Gestion des erreurs globales
      window.addEventListener('error', function(e) {
        console.error('Erreur de chargement:', e);
        if (performance.now() < 30000) { // Seulement dans les 30 premières secondes
          loadingScreen.style.display = 'none';
          errorFallback.style.display = 'flex';
        }
      });
      
      // Performance monitoring
      if ('performance' in window) {
        window.addEventListener('load', function() {
          setTimeout(function() {
            const perfData = performance.getEntriesByType('navigation')[0];
            if (perfData) {
              console.log('🚀 Performance ImpressLola:', {
                'Temps de chargement': Math.round(perfData.loadEventEnd - perfData.fetchStart) + 'ms',
                'DOM Ready': Math.round(perfData.domContentLoadedEventEnd - perfData.fetchStart) + 'ms',
                'First Paint': Math.round(performance.getEntriesByType('paint')[0]?.startTime || 0) + 'ms'
              });
            }
          }, 0);
        });
      }
    });
    
    // Optimisation des polices
    if ('fonts' in document) {
      Promise.all([
        document.fonts.load('400 16px Inter'),
        document.fonts.load('600 16px Inter'),
        document.fonts.load('700 16px Inter')
      ]).then(function() {
        document.documentElement.classList.add('fonts-loaded');
      });
    }
    
    // Service Worker pour PWA (si disponible)
    if ('serviceWorker' in navigator && 'production' === 'production') {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('✅ Service Worker enregistré:', registration.scope);
          })
          .catch(function(error) {
            console.log('❌ Échec Service Worker:', error);
          });
      });
    }
    
    // Optimisation des images lazy loading
    if ('IntersectionObserver' in window) {
      document.addEventListener('DOMContentLoaded', function() {
        const imageObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              if (img.dataset.src) {
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
                observer.unobserve(img);
              }
            }
          });
        });
        
        // Observer toutes les images avec data-src
        setTimeout(() => {
          document.querySelectorAll('img[data-src]').forEach(img => {
            imageObserver.observe(img);
          });
        }, 1000);
      });
    }
  </script>
